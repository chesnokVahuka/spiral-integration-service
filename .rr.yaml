version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: php app.php
  relay: pipes

kv:
  memory:
    driver: memory
    config: {}

http:
  address: 0.0.0.0:8080
  middleware: [ gzip, static ]
  static:
    dir: public
    forbid: [ .php, .htaccess ]
  pool:
    num_workers: 2
    supervisor:
      max_worker_memory: 100
