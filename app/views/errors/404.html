<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — страница не найдена</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f1419;
            color: #e7ecf3;
            padding: 1.5rem;
        }
        main {
            max-width: 28rem;
            text-align: center;
        }
        .code {
            font-size: 4.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            line-height: 1;
            color: #5b9cff;
        }
        h1 {
            margin-top: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
        }
        p {
            margin-top: 0.75rem;
            font-size: 0.95rem;
            color: #9aa8b8;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.55rem 1.1rem;
            border-radius: 0.5rem;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        a:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<main>
    <div class="code" aria-hidden="true">404</div>
    <h1>Страница не найдена</h1>
    <p>Запрошенный адрес не существует или был перемещён.</p>
    <a href="/health">Проверить статус сервиса</a>
</main>
</body>
</html>
